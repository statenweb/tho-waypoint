name: Update Changelog on Tag

on:
  push:
    tags:
      - "*" # triggers on every tag push

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # ensure we have the full commit history

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current and previous tag
        id: get_tags
        run: |
          # CURRENT_TAG is the ref name, e.g. 'refs/tags/0.0.2' -> '0.0.2'
          CURRENT_TAG="${GITHUB_REF##*/}"

          # Attempt to find the previous tag
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Get commit messages
        id: get_commits
        run: |
          if [ -z "${{ steps.get_tags.outputs.previous_tag }}" ]; then
            # No previous tag - go from the beginning
            COMMIT_MESSAGES=$(git log --pretty=format:"- %s" --no-merges)
          else
            COMMIT_MESSAGES=$(git log ${{ steps.get_tags.outputs.previous_tag }}..${{ steps.get_tags.outputs.current_tag }} --pretty=format:"- %s" --no-merges)
          fi

          # Store commit messages as a multi-line output
          echo "commit_messages<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          CURRENT_TAG="${{ steps.get_tags.outputs.current_tag }}"
          COMMIT_MESSAGES="${{ steps.get_commits.outputs.commit_messages }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          NEW_HEADING="## [$CURRENT_TAG] - $(date +'%Y-%m-%d')"

          (
            echo "$NEW_HEADING"
            echo ""
            echo "$COMMIT_MESSAGES"
            echo ""
            cat CHANGELOG.md
          ) > NEW_CHANGELOG.md

          mv NEW_CHANGELOG.md CHANGELOG.md

      # Instead of pushing to main, create a branch and commit changes there
      - name: Commit changes to a new branch
        run: |
          git checkout -b changelog-update-${{ steps.get_tags.outputs.current_tag }}
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ steps.get_tags.outputs.current_tag }}"

      # Create or update a PR using peter-evans/create-pull-request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: changelog-update-${{ steps.get_tags.outputs.current_tag }}
          base: main
          title: "docs: Update CHANGELOG for version ${{ steps.get_tags.outputs.current_tag }}"
          body: |
            This Pull Request updates the CHANGELOG with commit messages between:
            - **Previous Tag**: ${{ steps.get_tags.outputs.previous_tag }}
            - **Current Tag**: ${{ steps.get_tags.outputs.current_tag }}

            See commit messages:
            ${{ steps.get_commits.outputs.commit_messages }}
          # optional: if you want the PR to merge automatically if checks pass
          # automatically merge can be done with 'peter-evans/enable-pull-request-automerge' or GitHub auto-merge
